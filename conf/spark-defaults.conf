# spark.history.fs.logDirectory is set from EVENT_LOG_DIR in docker-compose.yml
spark.gluten.ui.enabled true
spark.history.fs.update.interval  10s
spark.history.ui.port             18080

# GCS support (jars/gcs-connector-*-shaded.jar). Auth uses Application Default Credentials:
# ~/.config/gcloud is mounted into the container, or set GOOGLE_APPLICATION_CREDENTIALS to a key file.
spark.hadoop.fs.gs.impl                     com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem
spark.hadoop.fs.AbstractFileSystem.gs.impl  com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS
spark.hadoop.fs.gs.auth.type                APPLICATION_DEFAULT

# Large event logs: hybrid store parses into memory, then spills to a disk-backed store,
# so not everything stays on the heap. Heap size itself is SPARK_DAEMON_MEMORY (docker-compose.yml).
spark.history.store.path                       /opt/history-store
spark.history.store.maxDiskUsage               50g
spark.history.store.hybridStore.enabled        true
# Keep well below SPARK_DAEMON_MEMORY.
spark.history.store.hybridStore.maxMemoryUsage 1g
spark.history.store.hybridStore.diskBackend    ROCKSDB
# JSON (default) or PROTOBUF; PROTOBUF is faster and more compact.
spark.history.store.serializer                 PROTOBUF
